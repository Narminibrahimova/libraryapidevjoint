spring:
  application:
    name: libraryapidevjoint

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect


jwt:
  token:
    validity: 86400000

  signing:
    key: ${JWT_SECRET}

  header:
    name: Authorization
    prefix: Bearer

  claims:
    role-key: roles